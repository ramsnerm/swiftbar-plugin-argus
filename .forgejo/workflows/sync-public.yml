name: Sync public branch

on:
  push:
    branches:
      - main

# contents:write is needed to push the resulting sync commit back to
# this repo (the public branch, which the Push Mirror then forwards to
# the public GitHub copy).
permissions:
  contents: write

jobs:
  sync:
    # Matches this instance's registered runner labels (docker, linux) -
    # "ubuntu-latest" isn't one of them, which is why the first run got
    # stuck in "waiting" forever.
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot main onto public
        run: |
          # Commit under the actual author's identity, not a bot one -
          # the sync content is theirs, this workflow just mechanically
          # carries it over, and a bot identity meant GitHub couldn't
          # attribute these commits to anyone (live-observed: distinct
          # from the manually-pushed commits, which showed up fine).
          # ${{ github.actor }} / pusher-email context fields aren't
          # reliably populated on Forgejo Actions, so this is hardcoded
          # rather than templated - matches the same name already
          # public in LICENSE and every other commit in this repo, so
          # nothing new is exposed by it being here too.
          git config user.name "Martin Ramsner"
          git config user.email "martin@ramsner.me"

          # public is an orphan branch (no shared history with main -
          # main's early commits briefly had personal paths/hostnames/a
          # webhook ID inline, before the config.local.sh/Keychain
          # split), so this replaces public's tree wholesale rather than
          # merging.
          git checkout public

          # Carry over the real commit message(s) from main instead of a
          # generic "Sync to main@X" - read what main SHA the previous
          # sync commit recorded (its "Synced-Main:" trailer) so this
          # sync can report exactly what changed since then.
          LAST_SYNCED_SHA=$(git log -1 --format=%B | sed -n 's/^Synced-Main: //p' | head -1)

          git rm -rq --ignore-unmatch -- .
          git checkout main -- .
          git add -A

          if git diff --cached --quiet; then
            echo "public already up to date with main - nothing to sync."
            exit 0
          fi

          MAIN_SHA=$(git rev-parse --short main)

          COMMIT_COUNT=1
          if [ -n "$LAST_SYNCED_SHA" ] && git cat-file -e "$LAST_SYNCED_SHA" 2>/dev/null; then
              RANGE="$LAST_SYNCED_SHA..main"
              COMMIT_COUNT=$(git rev-list --count "$RANGE")
          fi

          if [ "$COMMIT_COUNT" -le 1 ]; then
              SUBJECT=$(git log -1 --format=%s main)
              git commit -m "$SUBJECT" -m "Synced-Main: $MAIN_SHA"
          else
              SUBJECT="Sync $COMMIT_COUNT commits from main"
              BODY=$(git log --format='- %s' "$RANGE")
              git commit -m "$SUBJECT" -m "$BODY" -m "Synced-Main: $MAIN_SHA"
          fi

          git push origin public
